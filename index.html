<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الهدية مغلقة - HeartLink</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary: #ff4d4d;
            --secondary: #cc0000;
            --gold: #d4af37;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg: #030303;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* تأثير الخلفية الفخم */
        .hearts-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .heart-particle { position: absolute; color: var(--glass-border); opacity: 0.2; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* --- صفحة الإغلاق --- */
        #page-1 {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a0505 0%, #030303 100%);
            position: fixed; width: 100%; z-index: 9999;
        }
        
        .login-card {
            background: var(--glass); backdrop-filter: blur(25px); padding: 50px 30px;
            border-radius: 40px; border: 1px solid rgba(255, 77, 77, 0.3); text-align: center;
            width: 90%; max-width: 400px; 
            box-shadow: 0 0 40px rgba(255, 77, 77, 0.15); 
            position: relative;
        }
        
        .main-title { 
            font-weight: 900; 
            background: linear-gradient(45deg, #fff, var(--primary)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin: 0; 
        }

        .single-line-title {
            white-space: nowrap; 
            font-size: clamp(24px, 8vw, 32px); 
            margin-bottom: 15px;
            display: block;
        }

        .lock-icon {
            font-size: 60px;
            color: var(--primary);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255, 77, 77, 0.5));
            animation: pulseLock 2s infinite;
        }

        @keyframes pulseLock {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .btn-style { 
            display: inline-block;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05); 
            color: white; 
            border: 1px solid var(--glass-border); 
            padding: 18px 30px; 
            border-radius: 20px; 
            font-weight: 800; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 20px;
            transition: 0.3s; 
        }

        .btn-style:hover { 
            background: rgba(255, 255, 255, 0.1); 
            border-color: var(--primary);
        }

        /* HeartLink Credit CSS */
        .heartlink-credit {
            position: fixed;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            z-index: 99999;
            text-decoration: none;
            color: rgba(255,255,255,0.78);
            font-size: 11px;
            font-weight: 700;
            font-family: inherit;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            transition: 0.25s ease;
        }

        .heartlink-credit:hover {
            color: #fff;
            background: rgba(255,255,255,0.09);
            transform: translateX(-50%) translateY(-2px);
        }

        @media (max-width: 480px) {
            .heartlink-credit {
                font-size: 10px;
                bottom: 9px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="hearts-bg" id="hearts-container"></div>

    <section id="page-1">
        <div class="login-card animate__animated animate__zoomIn">
            <i class="fa-solid fa-lock lock-icon"></i>
            <h1 class="main-title single-line-title">الهدية مغلقة</h1>
            
            <p style="opacity:0.85; font-size:15px; margin-bottom:25px; line-height: 1.8; color: #eee;">
                عفواً، تم قفل هذه الهدية نهائياً من قبل المطور <br>
                <strong style="color: var(--gold); font-size: 18px;">HeartLink</strong> <br>
                ولا يمكن الوصول إليها أو استخدامها بعد الآن.
            </p>
            
            <a href="https://wa.me/201125674359" target="_blank" class="btn-style">
                <i class="fa-brands fa-whatsapp" style="margin-left: 8px;"></i> تواصل مع المطور
            </a>
        </div>
    </section>

    <!-- HeartLink Credit -->
    <a href="https://wa.me/201125674359" target="_blank" class="heartlink-credit">
        Made with ❤️ by HeartLink
    </a>

    <script>
        function createParticles() {
            const container = document.getElementById('hearts-container');
            setInterval(() => {
                const particle = document.createElement('i');
                // جعل الخلفية هادئة (دوائر صغيرة بدلاً من القلوب الملونة لتناسب الإغلاق)
                particle.className = 'fa-solid fa-circle heart-particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                particle.style.fontSize = (Math.random() * 4 + 2) + 'px';
                container.appendChild(particle);
                setTimeout(() => particle.remove(), 8000);
            }, 400);
        }

        window.onload = createParticles;
    </script>
<script>
  window.HEARTLINK_GIFT_ID = "gift-skdgdjd";
</script>
<script src="https://cdn.jsdelivr.net/gh/HeartLink349/Heart_Link@heartlink-lock-system/heartlink-lock.js"></script>
</body>
</html>
